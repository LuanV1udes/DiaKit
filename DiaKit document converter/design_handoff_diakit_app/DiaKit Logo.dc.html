  <style>
    :root{
      --font-heading: "Josefin Sans", system-ui, sans-serif;
      --font-body: "Josefin Sans", system-ui, sans-serif;

    .card{background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
  </style>
</helmet>

<div style="display:flex;flex-wrap:wrap;gap:40px;padding:64px;box-sizing:border-box;font-family:var(--font-body)">

  </div>

  <div>

      <svg width="88" height="88" viewBox="0 0 56 56" fill="none">
        <rect x="14" y="6" width="28" height="36" rx="3" stroke="#8c4a48" stroke-width="2.5"/>
        <path d="M32 6v9h9" stroke="#8c4a48" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M20 30l5 5 11-13" stroke="#a9784f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
